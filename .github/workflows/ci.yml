name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Self-hosted (the user's own Mac), not ubuntu-latest: GitHub-hosted
    # minutes are billed on this private repo and ran out mid-August 2026,
    # blocking every push with "spending limit needs to be increased".
    # Same fix already applied to Package Studio (see that workflow's
    # runs-on comment) — reuse the Mac that's already on for releases
    # instead of paying per minute for a Linux VM.
    runs-on: [self-hosted, macOS]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python virtual environment
        run: |
          # Not actions/setup-python@v5 (DT-0031/DT-0032): its macOS Python
          # archives are non-relocatable, hardcoded to
          # /Users/runner/hostedtoolcache, which doesn't exist on this
          # self-hosted Mac. Same workaround as package-studio.yml: use
          # whatever python3.13 is already installed and build an isolated
          # venv per run under $RUNNER_TEMP.
          if ! command -v python3.13 >/dev/null 2>&1; then
            echo "::error::python3.13 no está instalado en este Mac. Instálalo (p. ej. 'brew install python@3.13') y vuelve a lanzar el job." >&2
            exit 1
          fi
          python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Check project (paths, packaged version in sync with pyproject.toml)
        run: python scripts/check_project.py
