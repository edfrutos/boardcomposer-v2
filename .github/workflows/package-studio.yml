name: Package Studio

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,package]"

      - name: Run tests
        run: pytest -q

      - name: Build BoardComposer Studio.app
        run: |
          cd studio
          pyside6-deploy -f app.py

      - name: Zip the app bundle
        run: |
          cd studio/dist
          ditto -c -k --sequesterRsrc --keepParent BoardComposerStudio.app BoardComposerStudio-macos.zip

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" studio/dist/BoardComposerStudio-macos.zip \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" studio/dist/BoardComposerStudio-macos.zip \
              --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          fi
