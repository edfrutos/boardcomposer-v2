name: Package Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Pushing a tag alongside a branch update in one `git push` (--follow-tags/
# --atomic) can make GitHub deliver two separate push events for the same
# tag ref (observed on v0.3.31 and v0.3.35: identical head_sha, seconds
# apart). Without this, both duplicate runs execute the full signed build
# on the self-hosted Mac (~60-70min each). Grouping by ref + cancelling the
# older run in favour of the newer one keeps only one build running per tag.
concurrency:
  group: package-studio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    # Self-hosted (the user's own Mac), not macos-latest: GitHub-hosted
    # macOS runners cost ~10x a Linux minute on a private repo, and a
    # signed+notarized build here runs ~60-70min — that adds up fast with
    # a release cut every time a fix needs a real end-to-end test. Public
    # repos get free unlimited Actions minutes instead, but that would
    # expose billing.py/stripe_billing.py's plan/pricing logic, which
    # DT-0025 explicitly chose not to do. Self-hosted keeps the repo
    # private at zero marginal cost, using hardware the user already has
    # on for every release anyway (installing the .dmg by hand).
    runs-on: [self-hosted, macOS]

    env:
      APP_PATH: studio/dist/BoardComposerStudio.app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python virtual environment
        run: |
          # Not actions/setup-python@v5 (DT-0031/DT-0032): its macOS
          # Python archives are non-relocatable, hardcoded to install
          # into /Users/runner/hostedtoolcache — no override env var
          # (AGENT_TOOLSDIRECTORY, RUNNER_TOOL_CACHE) actually works
          # around that on a real self-hosted Mac, confirmed against
          # actions/setup-python#792 and #974. A self-hosted runner is
          # expected to already have its prerequisites installed, unlike
          # an ephemeral GitHub-hosted one — so this uses whatever
          # python3.13 is already on this Mac and builds an isolated venv
          # per run under $RUNNER_TEMP, instead of fighting a tool built
          # for provisioning fresh VMs. Keeps the machine's own Python
          # untouched and avoids dependency drift between releases.
          if ! command -v python3.13 >/dev/null 2>&1; then
            echo "::error::python3.13 no está instalado en este Mac. Instálalo (p. ej. 'brew install python@3.13') y vuelve a lanzar la release." >&2
            exit 1
          fi
          python3.13 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,package]"

      - name: Run tests
        run: pytest -q

      - name: Build BoardComposer Studio.app
        run: |
          cd studio
          pyside6-deploy -f app.py

      # Signing needs a Developer ID Application certificate, which needs a
      # paid Apple Developer account. Until those secrets exist the release
      # ships unsigned with install instructions instead (DT-0011). Nothing
      # here has to change on the day they do — only the secrets.
      - name: Check for signing credentials
        id: signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          if [ -n "$MACOS_CERTIFICATE_P12" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin credenciales de firma: se publicará una build sin firmar con docs/INSTALL-macos.md"
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A keychain of its own, with a throwaway password. On a
          # GitHub-hosted runner this never mattered (the VM is destroyed
          # after the job); on the self-hosted runner this project uses
          # instead (see the runs-on comment above), the machine and its
          # default keychain persist across every release — so the
          # original default is saved here and restored in the cleanup
          # step below, and the build keychain gets a per-run filename
          # (under $GITHUB_RUN_ID) so two runs can never collide —
          # leftover-keychain corpses from a previous crashed run don't
          # block a new one from creating its own.
          original_default_keychain="$(security default-keychain | tr -d ' "')"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$original_default_keychain" >> "$GITHUB_ENV"
          keychain_path="$RUNNER_TEMP/build-$GITHUB_RUN_ID.keychain-db"
          echo "BUILD_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"

          keychain_password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12

          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          # Without this the keychain re-locks after 5 minutes and codesign
          # fails partway through a long signing run.
          security set-keychain-settings -t 3600 -u "$keychain_path"

          security import /tmp/certificate.p12 -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without a UI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"

          rm -f /tmp/certificate.p12

          # Apple's Developer ID intermediate CA — without it in a keychain
          # codesign can find, chain-building fails with
          # "unable to build chain to self-signed root" / errSecInternalComponent
          # (confirmed on this runner: adding it only to the login keychain
          # wasn't enough, whatever the runner's search-list state is when
          # the launchd service runs headless). Importing it straight into
          # the build keychain sidesteps that entirely — self-contained,
          # works the same on any future self-hosted runner too, no
          # per-machine manual cert setup needed.
          curl -sL -o /tmp/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import /tmp/DeveloperIDG2CA.cer -k "$keychain_path"
          rm -f /tmp/DeveloperIDG2CA.cer

      - name: Prepare notarization API key
        # Decoded into $RUNNER_TEMP (not the checkout, not /tmp shared with
        # other steps) so it never lingers past this run — cleaned up
        # explicitly below regardless of how the job ends.
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Sign, notarize and staple
        if: steps.signing.outputs.available == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/sign_and_notarize.sh

      - name: Clean up temporary keychain and API key
        # Only matters on the self-hosted runner (see above), but harmless
        # everywhere: if: always() so a failure earlier in the job (a
        # broken build, a notarization timeout) still restores the
        # machine's real default keychain instead of leaving it pointed
        # at a build.keychain that a later run's create-keychain would
        # then fail to create fresh — and still deletes the decoded .p8,
        # which is secret material sitting as a plain file on a runner
        # that persists across releases.
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${BUILD_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$BUILD_KEYCHAIN_PATH" || true
          fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            rm -f "$APPLE_API_KEY_PATH" || true
          fi

      - name: Report what got shipped
        run: |
          echo "Firma del bundle publicado:"
          codesign -dv "$APP_PATH" 2>&1 | sed 's/^/  /'

      - name: Create dmg for distribution
        run: |
          cd studio/dist
          # Carpeta de montaje con el .app y un symlink a /Applications: el
          # patrón estándar de instalación en macOS (arrastrar a Aplicaciones),
          # en vez de un .zip que solo descomprime.
          staging="dmg-staging"
          rm -rf "$staging"
          mkdir "$staging"
          cp -R BoardComposerStudio.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "BoardComposer Studio" \
            -srcfolder "$staging" -ov -format UDZO \
            BoardComposerStudio-macos.dmg
          rm -rf "$staging"

      - name: Publish release asset
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.signing.outputs.available }}
        run: |
          assets=(studio/dist/BoardComposerStudio-macos.dmg)
          # An unsigned build is useless to whoever downloads it without the
          # one command that gets past Gatekeeper, so the instructions ride
          # along with it.
          if [ "$SIGNED" != "true" ]; then
            assets+=(docs/INSTALL-macos.md)
          fi

          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" \
              --repo "${{ github.repository }}" --clobber
          else
            gh release create "${{ github.ref_name }}" "${assets[@]}" \
              --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
          fi

      # boardcomposer-v2 is private, so its own release assets 404 for an
      # unauthenticated request (DT-0025) — "Buscar actualizaciones" (IDE-0032)
      # can point at the version, but the .dmg itself has to live somewhere
      # public too. edfrutos/boardcomposer-releases holds nothing but
      # binaries, no source, so this doesn't expose anything the private
      # repo doesn't already choose to publish as a signed .dmg (DT-0028).
      - name: Publish .dmg to the public releases repo
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Sin RELEASES_REPO_TOKEN: el .dmg no se publica en boardcomposer-releases, solo en este repo privado."
            exit 0
          fi

          if gh release view "${{ github.ref_name }}" --repo edfrutos/boardcomposer-releases >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" studio/dist/BoardComposerStudio-macos.dmg \
              --repo edfrutos/boardcomposer-releases --clobber
          else
            gh release create "${{ github.ref_name }}" studio/dist/BoardComposerStudio-macos.dmg \
              --repo edfrutos/boardcomposer-releases --title "${{ github.ref_name }}" --generate-notes
          fi

      # Closes DT-0028: the Gist studio/update_check.py reads used to be a
      # manual step in the release checklist, and got forgotten for two
      # releases in a row (v0.3.23, v0.3.24) with no error to notice it by.
      - name: Update the public version Gist
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/update_version_gist.py
